name: tera_capture
description: "Tera acquisition layer: accelerometer and camera capture with per-frame ROI means. Android only."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: id.tera.tera_capture
        pluginClass: TeraCapturePlugin
