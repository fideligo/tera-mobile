name: tera_patient
description: "Tera patient application. Guided SCG-PPG monitoring between clinic visits."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # The acquisition layer, shared with the device profiler. All sensor and camera work lives
  # there and has no dependency on either app's UI.
  tera_capture:
    path: ../packages/tera_capture
  # Talks to the Tera backend.
  http: ^1.2.2
  # Tokens are held in the Android Keystore, never in SharedPreferences — see
  # lib/auth/token_store.dart for why that distinction matters here.
  flutter_secure_storage: ^9.2.2
  meta: ^1.15.0

  # PROF-08 / HIST export: a clinician summary the patient can save or share from their own
  # phone. `pdf` composes the document; `printing` is the share/save/print sheet for it, and
  # its own PDF preview never touches the network.
  pdf: ^3.11.1
  printing: ^5.13.4
  camera: ^0.12.0+1
  sensors_plus: ^7.1.0
  image_picker: ^1.2.2
  flutter_dotenv: ^6.0.1
  path_provider: ^2.1.5

  # ADH-01: the daily check reminder. Scheduled and delivered entirely on the handset — no FCM, no
  # push token, no server round trip — which is the only arrangement that works for a patient whose
  # phone is offline between checks, and the only one that does not put "this person is monitoring
  # their blood pressure" through a third-party push service.
  flutter_local_notifications: ^18.0.1
  # Required by the above for `zonedSchedule`: a daily reminder has to fire at a wall-clock time in
  # the patient's own zone, and survive them crossing one.
  timezone: ^0.9.4

  # The version and build number, read from the running package rather than restated in Dart. A
  # constant in source drifts from the artifact the moment one is bumped without the other, and the
  # whole point of showing it is that a bug report names the build it came from.
  package_info_plus: ^8.1.2
  # Opens the privacy policy and support links in the system browser. An in-app webview would put
  # a Tera-branded chrome around a page Tera does not control, which is the wrong claim to make
  # about someone else's document.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Generates the launcher icons into android/app/src/main/res from the sources in assets/icon.
  # Build-time only: nothing imports it, and it ships in no APK.
  flutter_launcher_icons: ^0.14.3

# Launcher icons. Regenerate with:  dart run flutter_launcher_icons
#
# The sources are derived from assets/logo.jpeg by tool/make_icons.py rather than being pointed at
# directly, for two reasons that both bite on Android:
#
#   * A JPEG has no alpha. As an adaptive foreground it paints an opaque white square over the
#     whole canvas and hides `adaptive_icon_background` completely.
#   * The artwork reaches the corners of its own bounding box — a measured enclosing radius of 525
#     against a half-diagonal of 527 — so at full bleed a circular mask cuts the outer letters of
#     the wordmark and the ECG dot. The generated foreground is scaled so the artwork's enclosing
#     circle fits inside the 72dp-of-108dp safe circle, which is the only fit that survives every
#     launcher's mask shape.
#
# The background is white because that is the ground the logo was drawn on; the artwork is dark
# navy, so a brand-coloured background would need a light version of the mark that does not exist.
flutter_launcher_icons:
  android: true
  # No iOS target exists in this repo — `patient/ios` is absent, and `packages/tera_capture` ships
  # only an `android/` implementation, so there is nothing to generate into and nothing that would
  # run if there were. Set to true once an iOS target exists.
  ios: false
  image_path: "assets/icon/tera_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/tera_icon_fg.png"
  # Matches the app's own minSdk. Below 26 there are no adaptive icons and the legacy PNG is used.
  min_sdk_android: 26

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpeg
    - .env
